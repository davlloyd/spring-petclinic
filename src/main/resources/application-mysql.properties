# database init, supports mysql too
database=mysql
spring.datasource.url=${vcap.services.petclinic-db.credentials.jdbcUrl:jdbc:mysql://localhost/petclinic}
spring.datasource.username=${vcap.services.petclinic-db.credentials.username:petclinic}
spring.datasource.password=${vcap.services.petclinic-db.credentials.password:petclinic}
spring.datasource.name=${vcap.services.petclinic-db.credentials.name:petclinic}

# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always
